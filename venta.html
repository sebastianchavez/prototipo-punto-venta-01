<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f87839" />
    <meta name="description" content="Punto de venta · Template de punto de venta" />
    <title>prototipo punto ventas</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="venta">
    <!-- La pantalla utiliza su propio marcado HTML y controladores JavaScript nativos. -->
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="print-root"></div>
    <noscript>Activa JavaScript para utilizar esta demostración.</noscript>
    <!-- Estructura común y navegación. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="layout-fragment-3">
      <span class="count">{{ length }}</span>
    </script>

    <!-- Estructura común y navegación. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="layout-fragment-2">
      <a href="{{ id }}" class="nav-item {{ content }}" {{ content2 }}>
        {{ symbolIcon }}
        <span>{{ label }}</span>
        {{ content3 }}
      </a>
    </script>

    <!-- Estructura común y navegación. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="layout-fragment-1">
      <div class="nav-label">{{ group }}</div>
      {{ items }}
    </script>

    <!-- Estructura común y navegación. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="layout-fragment-4">
      <a href="usuarios.html" class="nav-item {{ content }}">{{ usersIcon }}Usuarios</a>
      <a href="configuracion.html" class="nav-item {{ content2 }}">
        {{ settingsIcon }}Configuración
      </a>
    </script>

    <!-- Estructura común y navegación. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="layout-page">
      <div class="shell">
        <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
          <a href="venta.html" class="brand">
            <img src="assets/favicon.svg" alt="" />
            <span>
              prototipo
              <br />
              punto ventas
              <span class="block !text-[9px] !font-normal !tracking-[1px] text-slate-400 mt-1">
                TU LOCAL, EN ORDEN
              </span>
            </span>
          </a>
          <nav class="flex-1 overflow-y-auto pb-3">{{ nav }}</nav>
          <div class="border-t border-slate-100 pt-3">
            {{ content }}
            <button class="nav-item w-full !text-[11px]" data-action="help">
              {{ helpIcon }}¿Necesitas una mano?
            </button>
            <div
              class="mt-3 bg-[#faf9f7] border border-[#f0ede8] rounded-lg p-3 flex gap-2.5 items-start"
            >
              <span class="w-1.5 h-1.5 rounded-full bg-orange-400 mt-1"></span>
              <div>
                <p class="text-[10px] font-semibold text-slate-600">Modo demostración</p>
                <p class="text-[9px] text-slate-400 mt-1 leading-4">
                  Tus datos se guardan en este navegador.
                </p>
              </div>
            </div>
          </div>
        </aside>
        <button
          id="nav-backdrop"
          class="nav-backdrop"
          data-action="mobile-menu"
          aria-label="Cerrar menú"
        ></button>
        <div class="workspace">
          <header class="topbar">
            <div class="flex gap-3 items-center">
              {{ btn }}
              <div class="crumb">
                {{ homeIcon }}
                <span>Mi local</span>
                {{ chevronIcon }}
                <strong>{{ value }}</strong>
              </div>
            </div>
            <div class="flex items-center gap-5">
              <span class="desktop-date text-[10px] text-slate-400">{{ content2 }}</span>
              <a href="caja.html" class="badge {{ content3 }} !px-2.5 !py-1.5">
                <span class="dot"></span>
                {{ content4 }}
              </a>
              <button
                data-action="alerts"
                class="relative text-slate-400"
                aria-label="Alertas de inventario"
              >
                {{ bellIcon }}{{ content5 }}
              </button>
              <span class="h-7 border-l border-slate-100"></span>
              <button
                data-action="login"
                class="flex items-center gap-2.5 text-left"
                aria-label="Cambiar usuario demo"
              >
                <span class="avatar">{{ initials }}</span>
                <span class="hidden sm:block">
                  <strong class="block text-[11px] font-semibold">{{ name }}</strong>
                  <span class="block text-[9px] text-slate-400 mt-1">{{ role }}</span>
                </span>
                {{ downIcon }}
              </button>
            </div>
          </header>
          <main class="main" id="main-content">
            {{ content6 }}
            <footer class="app-footer">
              <span>
                prototipo punto ventas
                <span class="mx-1">·</span>
                Hecho para el día a día de tu local.
              </span>
              <span class="flex items-center gap-1.5">
                <span class="w-1 h-1 rounded-full bg-emerald-500"></span>
                Datos guardados localmente
              </span>
            </footer>
          </main>
        </div>
      </div>
    </script>

    <!-- Contenido de Punto de venta. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="venta-fragment-2">
      <a href="caja.html" class="btn">{{ walletIcon }}Ver caja</a>
    </script>

    <!-- Contenido de Punto de venta. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="venta-fragment-1">
      <div class="page-heading">
        <div>
          <h1>Punto de venta</h1>
          <p>Todo listo para una nueva venta. ¿Qué preparamos hoy?</p>
        </div>
        <div class="flex flex-wrap gap-2">{{ content }}</div>
      </div>
    </script>

    <!-- Contenido de Punto de venta. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="venta-fragment-3">
      <button class="category {{ content }}" data-action="category" data-id="{{ c }}">
        {{ symbolIcon }}{{ c2 }}
      </button>
    </script>

    <!-- Contenido de Punto de venta. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="venta-fragment-4">
      <button
        class="product-card"
        data-action="add-cart"
        data-id="{{ id }}"
        {{
        content
        }}
        aria-label="Agregar {{ name }} al carrito"
      >
        <div class="product-photo">
          {{ image }}
          <span class="badge {{ content2 }}">{{ content3 }}</span>
        </div>
        <div class="product-info">
          <p class="type">{{ category }}</p>
          <h3>{{ name2 }}</h3>
          <div class="product-bottom">
            <span class="product-price">{{ price }}</span>
            <span class="product-add" aria-hidden="true">+</span>
          </div>
        </div>
      </button>
    </script>

    <!-- Contenido de Punto de venta. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="venta-fragment-5">
      <button data-action="channel" data-id="{{ c }}" class="{{ content }}">
        {{ symbolIcon }}{{ c2 }}
      </button>
    </script>

    <!-- Contenido de Punto de venta. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="venta-fragment-6">
      <option value="{{ id }}" {{ content }}>{{ name }}{{ content2 }}</option>
    </script>

    <!-- Contenido de Punto de venta. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="venta-fragment-7">
      <div class="cart-section">
        <div class="grid gap-2">
          <input
            data-cart="recipient"
            placeholder="Nombre del destinatario"
            aria-label="Destinatario"
            value="{{ recipient }}"
            class="!text-[11px]"
          />
          <input
            data-cart="address"
            placeholder="Dirección de entrega"
            aria-label="Dirección de entrega"
            value="{{ address }}"
            class="!text-[11px]"
          />
          <label class="!text-[10px]">
            Costo de envío
            <input
              data-cart="delivery"
              type="number"
              min="0"
              step="1"
              value="{{ delivery }}"
              class="!text-[11px]"
            />
          </label>
        </div>
      </div>
    </script>

    <!-- Contenido de Punto de venta. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="venta-fragment-9">
      <span class="text-[9px] text-orange-400">Promo −{{ discount }}</span>
    </script>

    <!-- Contenido de Punto de venta. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="venta-fragment-8">
      <div class="cart-item">
        {{ image }}
        <div>
          <h3>{{ name }}</h3>
          <div class="qty">
            <button
              data-action="qty"
              data-id="{{ productId }}"
              data-delta="-1"
              aria-label="Quitar una unidad de {{ name2 }}"
            >
              −
            </button>
            <span>{{ qty }}</span>
            <button
              data-action="qty"
              data-id="{{ productId2 }}"
              data-delta="1"
              aria-label="Agregar una unidad de {{ name3 }}"
            >
              +
            </button>
            <span class="text-slate-400">{{ content }}</span>
          </div>
          {{ content2 }}
        </div>
        <div class="text-right">
          <div class="text-[11px] font-semibold mt-1">{{ total }}</div>
          <button
            class="text-slate-300 text-[9px] mt-2"
            data-action="remove-cart"
            data-id="{{ productId3 }}"
            aria-label="Eliminar {{ name4 }}"
          >
            Quitar
          </button>
        </div>
      </div>
    </script>

    <!-- Contenido de Punto de venta. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="venta-fragment-10">
      <div class="cart-empty">
        <div class="empty-bag">{{ bagIcon }}</div>
        <strong>Tu venta empieza aquí</strong>
        <p>Agrega productos del catálogo para comenzar una nueva venta.</p>
      </div>
    </script>

    <!-- Contenido de Punto de venta. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="venta-fragment-11">
      <div class="total-row">
        <span>Envío</span>
        <span>{{ delivery }}</span>
      </div>
    </script>

    <!-- Contenido de Punto de venta. Los marcadores {{ nombre }} se completan desde JavaScript. -->
    <script type="text/html" id="venta-page">
      {{ content }}
      <div class="pos-layout">
        <section aria-label="Catálogo de productos">
          <div class="flex items-center gap-3">
            <div class="search-field flex-1">
              {{ searchIcon }}
              <input
                id="pos-search"
                type="search"
                placeholder="Buscar un producto o escanear código…"
                aria-label="Buscar productos"
                value="{{ search }}"
                autocomplete="off"
              />
            </div>
            {{ actionBtn }}
          </div>
          <div class="categories" aria-label="Categorías">{{ content2 }}</div>
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-[13px] font-semibold">
              {{ content3 }}
              <span class="text-[10px] text-slate-400 font-normal ml-1">({{ length }})</span>
            </h2>
            <span class="text-[10px] text-slate-400 flex items-center gap-1">
              {{ checkIcon }}Precios en CLP
            </span>
          </div>
          <div class="product-grid">{{ products }}</div>
          {{ content4 }}
          <div class="flex items-center gap-2 mt-5 text-[10px] text-slate-400">
            {{ helpIcon }}Selecciona un producto para agregarlo a la venta.
          </div>
        </section>
        <aside class="panel cart" aria-label="Venta actual">
          <div class="cart-header">
            <div>
              <h2>
                Venta actual
                <span
                  class="inline-flex items-center justify-center w-5 h-5 rounded-md bg-orange-50 text-orange-400 text-[10px] ml-1"
                >
                  {{ items }}
                </span>
              </h2>
              <p class="cart-meta">
                #{{ content5 }}
                <span class="mx-1">·</span>
                {{ content6 }}
              </p>
            </div>
            {{ actionBtn2 }}
          </div>
          <div class="cart-section"><div class="segmented">{{ content7 }}</div></div>
          <div class="cart-section">
            <div class="cart-client">
              {{ usersIcon }}
              <select id="cart-customer" aria-label="Cliente">
                <option value="">Cliente general</option>
                {{ customers }}
              </select>
              {{ actionBtn3 }}
            </div>
            <div class="flex justify-between items-center mt-3">
              <span class="text-[10px] text-slate-400">Tipo de venta</span>
              <select
                id="cart-mode"
                class="!w-auto !border-0 !p-0 !text-[10px] !text-slate-500"
                aria-label="Tipo de venta"
              >
                <option value="retail" {{ content8 }}>Minorista</option>
                <option value="wholesale" {{ content9 }}>Mayorista</option>
              </select>
            </div>
          </div>
          {{ content10 }}
          <div class="cart-items">{{ content11 }}</div>
          <div class="cart-totals">
            <div class="total-row">
              <span>Subtotal</span>
              <span>{{ subtotal }}</span>
            </div>
            <div class="total-row">
              <span>Promociones</span>
              <span class="!text-green-600">−{{ promotionDiscount }}</span>
            </div>
            <div class="total-row">
              <button class="text-orange-400 flex items-center gap-1" data-action="discount">
                {{ plusIcon }}Agregar descuento
              </button>
              <span>−{{ manualDiscount }}</span>
            </div>
            {{ content12 }}
            <div class="total-row grand-total">
              <span>Total a pagar</span>
              <span>{{ total }}</span>
            </div>
            <button
              class="btn btn-primary w-full !py-3.5 !mt-2 !text-[13px]"
              data-action="checkout"
              {{
              content13
              }}
            >
              {{ cardIcon }}Cobrar venta{{ arrowIcon }}
            </button>
            <div
              class="text-center text-[9px] text-slate-400 mt-3 flex justify-center items-center gap-1"
            >
              {{ lockIcon }}{{ content14 }}
            </div>
          </div>
        </aside>
      </div>
      <div class="mobile-cart-bar">
        <div>
          <p class="text-[10px] text-slate-400 mb-1">Total de tu venta</p>
          <strong class="text-lg text-orange-500">{{ total2 }}</strong>
        </div>
        {{ btn }}
      </div>
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
